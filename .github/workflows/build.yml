
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q As.zip -d project
          find project -name gradlew -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew -type f | head -n 1)
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/project" -name gradlew -type f | head -n 1)")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
